name: Publish Change Log

on:
  pull_request:
    types: [closed]
    paths:
      - 'src/lib/changelog/*.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.14.19)'
        required: true
        type: string
      send_email:
        description: 'Send product update email'
        type: boolean
        default: true
      send_discord:
        description: 'Send Discord notification'
        type: boolean
        default: true
      update_github_release:
        description: 'Update GitHub release notes'
        type: boolean
        default: true
      post_twitter:
        description: 'Post to Twitter/X'
        type: boolean
        default: true
      post_bluesky:
        description: 'Post to Bluesky'
        type: boolean
        default: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog content
        id: changelog
        run: |
          # Find the changelog file
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            CHANGELOG_FILE="src/lib/changelog/v${VERSION}.md"
          else
            CHANGELOG_FILE=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} \
              | grep 'src/lib/changelog/' | sort -V | tail -1)
          fi

          if [ -z "$CHANGELOG_FILE" ] || [ ! -f "$CHANGELOG_FILE" ]; then
            echo "Changelog file not found: $CHANGELOG_FILE"
            exit 1
          fi

          echo "file=$CHANGELOG_FILE" >> $GITHUB_OUTPUT
          echo "Processing: $CHANGELOG_FILE"

          # Extract frontmatter fields
          VERSION=$(grep '^version:' "$CHANGELOG_FILE" | head -1 | sed 's/version: *//')
          TITLE=$(grep '^title:' "$CHANGELOG_FILE" | head -1 | sed 's/title: *//')
          SOCIAL_POST=$(grep '^social_post:' "$CHANGELOG_FILE" | head -1 | sed 's/social_post: *//' | sed 's/^"//;s/"$//' | sed 's/\\n/\n/g')
          CONTRIBUTORS=$(grep '^contributors:' "$CHANGELOG_FILE" | head -1 | sed 's/contributors: *//')
          CATEGORY=$(grep '^category:' "$CHANGELOG_FILE" | head -1 | sed 's/category: *//')
          EMAIL_SUBJECT=$(grep '^email_subject:' "$CHANGELOG_FILE" | head -1 | sed 's/email_subject: *//')

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "contributors=$CONTRIBUTORS" >> $GITHUB_OUTPUT
          echo "category=$CATEGORY" >> $GITHUB_OUTPUT
          echo "email_subject=$EMAIL_SUBJECT" >> $GITHUB_OUTPUT

          # Handle multiline social_post
          {
            echo "social_post<<SOCIAL_EOF"
            echo "$SOCIAL_POST"
            echo "SOCIAL_EOF"
          } >> $GITHUB_OUTPUT

          # Extract body (everything after the closing ---)
          BODY=$(sed -n '/^---$/,/^---$/!p' "$CHANGELOG_FILE" | tail -n +2)

          # Store body with delimiter for multiline
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

          # Read email HTML file if it exists
          EMAIL_FILE="${CHANGELOG_FILE%.md}.email.html"
          if [ -f "$EMAIL_FILE" ]; then
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "email_body<<$EOF" >> $GITHUB_OUTPUT
            cat "$EMAIL_FILE" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "$EOF" >> $GITHUB_OUTPUT
          else
            echo "email_body=" >> $GITHUB_OUTPUT
          fi

          echo "Version: $VERSION"
          echo "Title: $TITLE"
          echo "Category: $CATEGORY"

      # Requires a Brevo email template with these params:
      #   {{ params.content }}  — AI-generated release highlights (HTML fragment)
      #   {{ params.version }}  — version string (e.g., "0.14.14")
      # Template handles header, footer, branding, unsubscribe. Set BREVO_TEMPLATE_ID to the template ID.
      - name: Send product update email via Brevo
        if: (github.event_name != 'workflow_dispatch' && contains(fromJSON('["A", "B"]'), steps.changelog.outputs.category)) || (github.event_name == 'workflow_dispatch' && inputs.send_email)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_TEMPLATE_ID: ${{ vars.BREVO_TEMPLATE_ID }}
          EMAIL_SUBJECT: ${{ steps.changelog.outputs.email_subject }}
          EMAIL_BODY: ${{ steps.changelog.outputs.email_body }}
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          if [ -z "$BREVO_API_KEY" ]; then
            echo "::warning::BREVO_API_KEY not set — skipping email"
            exit 0
          fi

          if [ -z "$BREVO_TEMPLATE_ID" ]; then
            echo "::warning::BREVO_TEMPLATE_ID not set — skipping email"
            exit 0
          fi

          if [ -z "$EMAIL_BODY" ]; then
            echo "::warning::No email body found — skipping email"
            exit 0
          fi

          # Build changelog URL with UTM tracking (for template CTA)
          CHANGELOG_URL="https://scanopy.net/changelog/v${VERSION}?utm_source=brevo&utm_medium=email&utm_campaign=product_update_v${VERSION}"

          # Fetch template HTML from Brevo
          TEMPLATE_RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "https://api.brevo.com/v3/smtp/templates/${BREVO_TEMPLATE_ID}" \
            -H "api-key: ${BREVO_API_KEY}")

          HTTP_CODE=$(echo "$TEMPLATE_RESPONSE" | tail -1)
          TEMPLATE_RESPONSE=$(echo "$TEMPLATE_RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Failed to fetch Brevo template (HTTP $HTTP_CODE): $TEMPLATE_RESPONSE"
            exit 1
          fi

          # Substitute placeholders and build campaign payload
          PAYLOAD=$(echo "$TEMPLATE_RESPONSE" | jq \
            --arg subject "$EMAIL_SUBJECT" \
            --arg content "$EMAIL_BODY" \
            --arg changelog_url "$CHANGELOG_URL" \
            --arg name "Product Update v${VERSION}" \
            '.htmlContent
             | gsub("\\{\\{ params\\.content \\}\\}"; $content)
             | gsub("\\{\\{ params\\.changelog_url \\}\\}"; $changelog_url)
             | {
                 type: "classic",
                 sender: {name: "Maya from Scanopy", email: "maya@email.scanopy.net"},
                 name: $name,
                 subject: $subject,
                 htmlContent: .,
                 recipients: {listIds: [13]},
                 replyTo: "maya@email.scanopy.net"
               }')

          # Create email campaign
          CAMPAIGN_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.brevo.com/v3/emailCampaigns" \
            -H "api-key: ${BREVO_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$CAMPAIGN_RESPONSE" | tail -1)
          CAMPAIGN_RESPONSE=$(echo "$CAMPAIGN_RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Brevo API returned HTTP $HTTP_CODE: $CAMPAIGN_RESPONSE"
            exit 1
          fi

          CAMPAIGN_ID=$(echo "$CAMPAIGN_RESPONSE" | jq -r '.id')

          if [ -z "$CAMPAIGN_ID" ] || [ "$CAMPAIGN_ID" = "null" ]; then
            echo "::error::Failed to get campaign ID from Brevo response: $CAMPAIGN_RESPONSE"
            exit 1
          fi

          echo "Brevo campaign draft created: $CAMPAIGN_ID"
          echo "Preview and send from https://app.brevo.com/campaign/email/$CAMPAIGN_ID"

      - name: Send Discord notification
        if: github.event_name != 'workflow_dispatch' || inputs.send_discord
        env:
          RELEASE_CHANNEL_WEBHOOK: ${{ secrets.RELEASE_CHANNEL_WEBHOOK }}
          VERSION: ${{ steps.changelog.outputs.version }}
          TITLE: ${{ steps.changelog.outputs.title }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: |
          # Truncate body if too long for Discord (max 4096 for embed description)
          TRUNCATED="${BODY:0:3800}"
          if [ ${#BODY} -gt 3800 ]; then
            TRUNCATED="${TRUNCATED}...\n\n[Read full changelog](https://scanopy.net/changelog/v${VERSION})"
          fi

          # Escape for JSON
          TRUNCATED=$(echo "$TRUNCATED" | jq -Rs .)

          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"v${VERSION}: ${TITLE}\",
                \"url\": \"https://scanopy.net/changelog/v${VERSION}\",
                \"description\": ${TRUNCATED},
                \"color\": 5814783,
                \"footer\": {
                  \"text\": \"Scanopy Release\"
                },
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" \
            "$RELEASE_CHANNEL_WEBHOOK"

          echo "Discord notification sent"

      - name: Update GitHub Release Notes
        if: github.event_name != 'workflow_dispatch' || inputs.update_github_release
        env:
          GH_TOKEN: ${{ secrets.UPDATE_SCANOPY_RELEASES_TOKEN }}
        run: |
          RELEASE_TAG="v${{ steps.changelog.outputs.version }}"

          echo "Updating release notes for $RELEASE_TAG in scanopy/scanopy..."

          # Check if release exists
          if ! gh release view "$RELEASE_TAG" --repo scanopy/scanopy > /dev/null 2>&1; then
            echo "::warning::Release $RELEASE_TAG not found in scanopy/scanopy. Skipping."
            exit 0
          fi

          # Write body to temp file to handle multiline content safely
          cat > /tmp/release-notes.md << 'RELEASE_BODY_EOF'
          ${{ steps.changelog.outputs.body }}
          RELEASE_BODY_EOF

          gh release edit "$RELEASE_TAG" \
            --repo scanopy/scanopy \
            --notes-file /tmp/release-notes.md

          echo "Successfully updated release notes for $RELEASE_TAG"

      - name: Post to Twitter/X
        if: github.event_name != 'workflow_dispatch' || inputs.post_twitter
        uses: noweh/post-tweet-v2-action@v1.0
        with:
          message: |
            Scanopy v${{ steps.changelog.outputs.version }}

            ${{ steps.changelog.outputs.social_post }}

            https://scanopy.net/changelog/v${{ steps.changelog.outputs.version }}?utm_source=twitter&utm_medium=social&utm_campaign=release_v${{ steps.changelog.outputs.version }}
          consumer-key: ${{ secrets.TWITTER_CONSUMER_KEY }}
          consumer-secret: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          access-token: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          access-token-secret: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}

      - name: Post to Bluesky
        if: github.event_name != 'workflow_dispatch' || inputs.post_bluesky
        uses: myConsciousness/bluesky-post@v5
        with:
          text: |
            Scanopy v${{ steps.changelog.outputs.version }}

            ${{ steps.changelog.outputs.social_post }}

            https://scanopy.net/changelog/v${{ steps.changelog.outputs.version }}?utm_source=bluesky&utm_medium=social&utm_campaign=release_v${{ steps.changelog.outputs.version }}
          identifier: ${{ secrets.BLUESKY_IDENTIFIER }}
          password: ${{ secrets.BLUESKY_PASSWORD }}

