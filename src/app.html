<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!--
			Apply the theme before first paint to avoid a flash. Follows the OS theme
			automatically, but honors a shared 'scanopy-theme' override (set by the
			Scanopy app) for cross-property consistency. Must stay first in <head>.
		-->
		<script>
			(function () {
				try {
					var t = localStorage.getItem('scanopy-theme') || 'system';
					var d =
						t === 'dark' ||
						(t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', d);
					document.documentElement.style.colorScheme = d ? 'dark' : 'light';
				} catch (e) {}
			})();
		</script>
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/brand/scanopy-logo.webp" type="image/webp" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://app.scanopy.net" />
		<link rel="preconnect" href="https://ph.scanopy.net" />
		<link rel="preconnect" href="https://api.github.com" />

		<!-- Favicons -->
		<link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png" />
		<link rel="manifest" href="/favicons/site.webmanifest" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
